[project]
name = "serviceforge-dispatch-mcp"
version = "0.1.0"
description = "Local stdio MCP server giving a dispatcher agent a small, safe view of ServiceForge."
requires-python = ">=3.11"
dependencies = ["mcp>=1.10,<2", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
serviceforge-dispatch-mcp = "serviceforge_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serviceforge_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
